# git-cliff configuration. See https://git-cliff.org/docs/configuration
#
# Release notes group commits by type. Squash-merged pull requests carry the
# PR title as the subject, which spells the type capitalized and separated by
# `/`, `:` or `(` (`Feat/deploy aliased receivers`), so the type parsers match
# case-insensitively and accept any of those separators. Merge commits and
# version bump chores stay out. Unconventional subjects land under Other
# Changes. Run offline so notes never depend on the GitHub API:
#
#   git cliff --config cliff.toml --current --strip header --offline

[changelog]
body = """
{% if version %}## meta-ast {{ version }}{% else %}## Unreleased{% endif %}

Polyglot static analysis engine for Python, JavaScript, TypeScript, TSX, C, C++, Rust, Go, and Ruby.
See the [README](https://github.com/metacall/meta-ast#readme) for usage.

{% for entry in commits | commit_groups(groups=commit_parsers_groups) -%}
### {{ entry.group | striptags | trim }}

{% for commit in entry.commits -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/metacall/meta-ast/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
### Install

- CLI: `cargo install meta-ast{% if version %} --version {{ version | trim_start_matches(pat="v") }}{% endif %}`
- Library: `cargo add meta-ast{% if version %}@{{ version | trim_start_matches(pat="v") }}{% endif %}`
- Prebuilt binaries are attached for Linux (glibc and musl), macOS (x86_64 and aarch64), and Windows (x86_64 and aarch64), in core and `metacall-deploy` variants.
{% if previous.version %}
**Full Changelog**: https://github.com/metacall/meta-ast/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = '(?i)^feat\s*[/:(]', group = "<!-- 0 -->Features" },
    { message = '(?i)^fix\s*[/:(]', group = "<!-- 1 -->Bug Fixes" },
    { message = '(?i)^perf\s*[/:(]', group = "<!-- 2 -->Performance" },
    { message = '(?i)^refactor\s*[/:(]', group = "<!-- 3 -->Refactoring" },
    { message = '(?i)^docs?\s*[/:(]', group = "<!-- 4 -->Documentation" },
    { message = '(?i)^test\s*[/:(]', group = "<!-- 5 -->Testing" },
    { message = '(?i)^build\s*[/:(]', group = "<!-- 6 -->Build" },
    { message = '(?i)^ci\s*[/:(]', group = "<!-- 7 -->CI" },
    { message = '(?i)^style\s*[/:(]', group = "<!-- 8 -->Style" },
    { message = '(?i)^revert\s*[/:(]', group = "<!-- 9 -->Reverts" },
    { message = '(?i)^chore\(release\)', skip = true },
    { message = '(?i)^chore.*version', skip = true },
    { message = '(?i)^chore\s*[/:(]', group = "<!-- 10 -->Maintenance" },
    { message = "(?i)^Merge", skip = true },
    { message = ".*", group = "<!-- 11 -->Other Changes" },
]
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
commit_preprocessors = [
    { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/metacall/meta-ast/pull/${1}))" },
    # GitHub copies the squashed commit messages into the body as a bullet list;
    # the notes only want the title line.
    { pattern = '(?s)^([^\n]*)\n\s*\* .*', replace = "${1}" },
    # A squash-merged pull request keeps the PR title as the subject, and GitHub
    # copies the squashed commit messages into the body. Normalize the title to a
    # Conventional Commit so the type groups the entry and the body stays out.
    { pattern = '^Feat/', replace = "feat: " },
    { pattern = '^Fix/', replace = "fix: " },
    { pattern = '^Perf/', replace = "perf: " },
    { pattern = '^Refactor/', replace = "refactor: " },
    { pattern = '^Docs/', replace = "docs: " },
    { pattern = '^Doc/', replace = "docs: " },
    { pattern = '^Test/', replace = "test: " },
    { pattern = '^Build/', replace = "build: " },
    { pattern = '^CI/', replace = "ci: " },
    { pattern = '^Style/', replace = "style: " },
    { pattern = '^Revert/', replace = "revert: " },
    { pattern = '^Chore/', replace = "chore: " },
]
